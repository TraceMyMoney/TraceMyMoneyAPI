name: CI/CD - Build & Deploy

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # Every branch / PR: make sure the image still builds. Nothing is pushed to
  # Docker Hub. The real image is built on the EC2 box at deploy time.
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image (no push)
        run: docker build -t smm-api:ci .

  deploy:
    runs-on: ubuntu-latest
    needs: build-check
    if: github.ref_name == 'master' && github.event_name != 'pull_request'

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Deploy to EC2
        run: |
          # The deploy dir is passed as a positional arg to the remote bash
          # (bash -s -- <path>, read as $1) because the heredoc is
          # single-quoted: that stops the runner from expanding anything in
          # the remote script, and also stops any variable set inside it
          # from expanding on the remote.
          ssh -o StrictHostKeyChecking=no ubuntu@${{ secrets.EC2_HOST }} bash -s -- /home/ubuntu/TraceMyMoneyAPI << 'EOF'
            set -e
            DEPLOY_DIR="$1"
            cd "$DEPLOY_DIR"

            echo "=== Syncing repo from git ==="
            git fetch origin master
            git reset --hard origin/master

            echo "=== Making sure the shared nginx network exists ==="
            # nginx lives in ~/gateway-nginx and reaches this API through
            # edge-network; compose refuses to start without it.
            docker network inspect edge-network >/dev/null 2>&1 || docker network create edge-network

            echo "=== Building image on this box ==="
            # Built before stopping anything, so a broken build leaves the
            # running API untouched.
            docker compose build

            echo "=== Running database migrations ==="
            # Uses ../env/.env.prod (DATABASE_URL) via the compose env_file.
            # set -e aborts the deploy here if a migration fails.
            docker compose run --rm --no-deps trackmoney_api uv run alembic upgrade head

            echo "=== Restarting containers ==="
            docker compose down --remove-orphans
            docker compose up -d --remove-orphans

            echo "=== Waiting for the API ==="
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null http://localhost:5000/docs; then
                echo "API is up"
                break
              fi
              if [ "$i" = "15" ]; then
                echo "API did not come up in time. Last logs:"
                docker logs --tail 50 stalkmymoney_api || true
                exit 1
              fi
              sleep 3
            done

            echo "=== Cleaning up dangling images ==="
            docker image prune -f

            echo "=== Container status ==="
            docker compose ps

            echo "=== Deployment complete ==="
          EOF
