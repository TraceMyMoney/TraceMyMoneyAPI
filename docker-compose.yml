services:
  # No postgres service here, and that's deliberate: production points
  # DATABASE_URL (in ../env/.env.prod, loaded via env_file below) at the
  # EC2-hosted Postgres instance directly - never at a container in this
  # file. Local dev's own throwaway Postgres container lives entirely in
  # docker-compose.dev.yml instead (see that file's header) - it is NOT
  # picked up here since deploy_on_ec2.yml's `docker compose up -d` on the
  # EC2 box runs with no -f flags at all, so only this file is ever read
  # there. Do not merge the two by renaming dev.yml to
  # docker-compose.override.yml - Compose auto-merges that name with no
  # flags needed, which would start a local Postgres container and point
  # production at it instead of the real EC2 instance.
  trackmoney_api:
    build: .
    image: parimalmahindrakar/track_money_api:latest
    container_name: stalkmymoney_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ../env/.env.prod
    networks:
      - app-network
      - edge-network
    command: uv run uvicorn main:app --host 0.0.0.0 --port 5000 --reload
#    extra_hosts:
#     - "host.docker.internal:host-gateway"

networks:
  app-network:
    driver: bridge
  # Shared with the nginx gateway (~/projects/gateway-nginx); create it once
  # with `docker network create edge-network`.
  edge-network:
    external: true
    name: edge-network
