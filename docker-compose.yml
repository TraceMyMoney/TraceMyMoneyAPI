services:
  # No postgres service here, and that's deliberate: production points
  # DATABASE_URL (in ../env/.env.prod, loaded via env_file below) at the
  # EC2-hosted Postgres instance directly - never at a container in this
  # file. Local dev's own throwaway Postgres container lives entirely in
  # docker-compose.dev.yml instead (see that file's header) - it is NOT
  # picked up here since deploy_on_ec2.yml's `docker compose up -d` on the
  # EC2 box runs with no -f flags at all, so only this file is ever read
  # there. Do not merge the two by renaming dev.yml to
  # docker-compose.override.yml - Compose auto-merges that name with no
  # flags needed, which would start a local Postgres container and point
  # production at it instead of the real EC2 instance.
  trackmoney_api:
    # TODO: this is a stale image name - CI (.github/workflows/
    # deploy_on_ec2.yml) actually builds and pushes
    # parimalmahindrakar/track_money_api, not parimalmahindrakar/smm-image.
    # Left as-is since fixing it is outside this refactor's scope.
    image: parimalmahindrakar/smm-image
    container_name: stalkmymoney_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ../env/.env.prod
    networks:
      - app-network
    command: uv run uvicorn main:app --host 0.0.0.0 --port 5000 --reload

  rabbitmq:
    image: "rabbitmq:3-management"
    hostname: "rabbitmq"
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: parimalmahindrakar/tracemymoney_nginx:latest
    container_name: tm_nginx_server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/etc/ssl/certs/tm_keys:/etc/ssl/certs/tm_keys"
      - "/etc/ssl/certs/rm_keys:/etc/ssl/certs/rm_keys"
    depends_on:
      - trackmoney_api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
