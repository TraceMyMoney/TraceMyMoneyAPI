[project]
name = "stalk-my-money"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.135.3",
    # Mailgun HTTP client (app/services/email/sender.py); also used by the MCP image.
    "httpx>=0.27.0",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-core>=1.2.28",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.7.3",
    "langchain-typesafe>=0.0.1a3",
    "langgraph>=1.2.18",
    "passlib>=1.7.4",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.12.5",
    "python-jose>=3.5.0",
    # Form bodies: the OAuth /oauth/token endpoint is form-encoded (RFC 6749).
    "python-multipart>=0.0.26",
    "reportlab>=5.1.0",
    "sqlalchemy[asyncio]>=2.0",
    "sqlglot>=30.25.0",
    "typesafe-sdk>=0.7.5",
    "uvicorn>=0.44.0",
]

# MCP server (mcp_server/): a plain HTTP client of this API, installed only in
# its own image (`uv sync --frozen --extra mcp`). Pinned EXACTLY to the 3.x
# release obsidian-clone's MCP server runs on: the 2.x line has no "http"
# transport and its run() rejects host/port (TypeError: run() got an
# unexpected keyword argument 'host'), and a plain ">=3,<4" lets a rebuild
# drift. After changing this pin run `uv lock` and commit uv.lock - the
# Docker build uses --frozen and ignores the pin if the lock disagrees.
[project.optional-dependencies]
mcp = [
    "fastmcp==3.4.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "pre-commit>=4.6.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
